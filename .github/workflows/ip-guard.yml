name: ip-guard
on:
  push:
  pull_request:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No game content or references to protected works
        run: python3 tools/ip_guard.py
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install numpy Pillow pytest
      - run: python -m pytest -q tools/tests
