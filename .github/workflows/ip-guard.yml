name: ip-guard
on:
  push:
  pull_request:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: No game content, secrets or references to protected works
        run: python3 tools/ip_guard.py
      - name: Commit messages too
        run: git log -n 50 --format=%B > /tmp/msgs.txt && python3 tools/ip_guard.py --message /tmp/msgs.txt
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install numpy Pillow scipy pytest
      - run: python -m pytest -q tools/tests
